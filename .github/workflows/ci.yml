name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: write   # lets GitHub log in to Azure without a password (OIDC)
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  deploy:
    needs: test   # only runs if every test passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and upload the container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/loan-risk-app:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/loan-risk-app:latest

      - name: Log in to Azure (no password)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the new version to both apps
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          IMAGE=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/loan-risk-app:${{ github.sha }}
          az containerapp update --name loan-risk-api --resource-group loan-risk-rg --image $IMAGE
          az containerapp update --name loan-risk-web --resource-group loan-risk-rg --image $IMAGE
